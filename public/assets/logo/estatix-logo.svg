<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" fill="none">
  <!-- Estatix Architectural Symbol -->
  <g id="symbol">
    <!-- Left Base -->
    <line x1="50" y1="285" x2="333" y2="285" stroke="currentColor" stroke-width="9" stroke-linecap="square" />
    <!-- Vertical Wall -->
    <line x1="222" y1="285" x2="222" y2="120" stroke="currentColor" stroke-width="9" stroke-linecap="square" />
    <!-- Sloped Roofline -->
    <line x1="222" y1="120" x2="534" y2="35" stroke="currentColor" stroke-width="9" stroke-linecap="square" />
    <!-- Solid Extruded Pillar -->
    <polygon points="463,285 463,72 534,35 534,285" fill="currentColor" />
    <!-- Right Base -->
    <line x1="463" y1="285" x2="710" y2="285" stroke="currentColor" stroke-width="9" stroke-linecap="square" />
  </g>
  <!-- Spaced Brand Text -->
  <text x="385" y="415" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="500" letter-spacing="28" text-anchor="middle" fill="currentColor">ESTATIX</text>
</svg>
